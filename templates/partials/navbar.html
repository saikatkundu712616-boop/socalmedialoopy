{% load static %}
<nav class="navbar">
    <div class="navbar-inner">

        <a href="{% url 'home' %}" class="navbar-brand" aria-label="Looply home">
            <span class="brand-mark">L</span><span>looply</span>
        </a>

        <div class="navbar-search">
            <form method="get" action="{% url 'core:search' %}" role="search">
                <span aria-hidden="true">⌕</span>
                <input type="search" name="q" placeholder="Search people or posts" aria-label="Search people or posts" value="{{ request.GET.q|default:'' }}">
            </form>
        </div>

        <button class="nav-toggle" type="button" aria-label="Toggle navigation" aria-expanded="false" aria-controls="primary-navigation">☰</button>
        <div class="navbar-links" id="primary-navigation">
            {% if user.is_authenticated %}
                    <a href="{% url 'posts:feed' %}" class="nav-link">🏠 Feed</a>
                    <a href="{% url 'accounts:discover' %}" class="nav-link">🔍 Discover</a>   <!-- NEW -->
                    <a href="{% url 'posts:create_post' %}" class="nav-link">✏️ Post</a>
                    <a href="{% url 'core:notifications' %}" class="nav-link notif-link">
                        🔔
                        <span class="notif-badge" id="notif-badge" hidden>0</span>
                    </a>

                    <a href="{% url 'accounts:profile' user.username %}" class="nav-profile">
                        <img src="{{ user.profile.avatar.url }}" class="avatar-xs" alt="">
                        {{ user.username }}
                    </a>

                    <a href="{% url 'accounts:logout' %}" class="nav-link logout">Logout</a>
            {% else %}
                <a href="{% url 'accounts:login' %}" class="nav-link">Login</a>
                <a href="{% url 'accounts:register' %}" class="btn-primary btn-sm">Sign up</a>
            {% endif %}
        </div>
    </div>
</nav>
