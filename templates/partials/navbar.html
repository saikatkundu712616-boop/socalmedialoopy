{% load static %}
<header class="navbar">
    <div class="navbar-inner">

        <a href="{% url 'home' %}" class="brand" aria-label="Looply home">
            <span class="brand-mark">L</span>
            <span class="brand-name">looply</span>
        </a>

        <form class="nav-search" method="get" action="{% url 'core:search' %}" role="search">
            <svg viewBox="0 0 24 24" aria-hidden="true">
                <circle cx="11" cy="11" r="7"></circle>
                <path d="m20 20-3.2-3.2"></path>
            </svg>
            <input type="search" name="q" placeholder="Search people or posts"
                   aria-label="Search people or posts"
                   value="{{ request.GET.q|default:'' }}">
        </form>

        <button class="nav-toggle" type="button"
                aria-label="Toggle navigation"
                aria-expanded="false"
                aria-controls="primary-navigation">
            <svg viewBox="0 0 24 24" aria-hidden="true">
                <path d="M4 7h16M4 12h16M4 17h16"></path>
            </svg>
        </button>

        <nav class="nav-links" id="primary-navigation">
            {% if user.is_authenticated %}

                <a href="{% url 'posts:feed' %}" class="nav-link">
                    <svg viewBox="0 0 24 24" aria-hidden="true">
                        <path d="M3 10.5 12 3l9 7.5"></path>
                        <path d="M5 9.5V21h14V9.5"></path>
                    </svg>
                    <span>Feed</span>
                </a>

                <a href="{% url 'accounts:discover' %}" class="nav-link">
                    <svg viewBox="0 0 24 24" aria-hidden="true">
                        <circle cx="11" cy="11" r="7"></circle>
                        <path d="m20 20-3.2-3.2"></path>
                    </svg>
                    <span>Discover</span>
                </a>

                <a href="{% url 'posts:create_post' %}" class="nav-link">
                    <svg viewBox="0 0 24 24" aria-hidden="true">
                        <path d="M12 5v14M5 12h14"></path>
                    </svg>
                    <span>Post</span>
                </a>

                <a href="{% url 'core:notifications' %}" class="nav-link notif-link" aria-label="Notifications">
                    <svg viewBox="0 0 24 24" aria-hidden="true">
                        <path d="M18 8a6 6 0 1 0-12 0c0 6-2 7-2 7h16s-2-1-2-7"></path>
                        <path d="M13.7 20a2 2 0 0 1-3.4 0"></path>
                    </svg>
                    <span class="notif-badge" id="notif-badge" hidden>0</span>
                </a>

                <details class="nav-user">
                    <summary>
                        <img src="{{ user.profile.avatar.url }}" class="avatar-xs" alt="">
                        <span class="nav-user-name">{{ user.username }}</span>
                        <svg class="chev" viewBox="0 0 24 24" aria-hidden="true">
                            <path d="m6 9 6 6 6-6"></path>
                        </svg>
                    </summary>

                    <div class="nav-user-menu">
                        <a href="{% url 'accounts:profile' user.username %}">View profile</a>
                        <a href="{% url 'accounts:edit_profile' %}">Edit profile</a>
                        <a href="{% url 'accounts:discover' %}">Discover people</a>
                        <hr>
                        <a href="{% url 'accounts:logout' %}" class="danger">Log out</a>
                    </div>
                </details>

            {% else %}
                <a href="{% url 'accounts:login' %}" class="btn-ghost">Log in</a>
                <a href="{% url 'accounts:register' %}" class="btn-primary btn-sm">Sign up</a>
            {% endif %}
        </nav>

    </div>
</header>
