{% extends "base.html" %}
{% block title %}Create account · Looply{% endblock title %}

{% block content %}
<div class='auth-card'>
    <h2>Create your account</h2>

    <form method="POST" novalidate>
        {% csrf_token %}

        <label>Username</label>
        <input type="text" name="username" value="{{ username|default:'' }}" required maxlength="30">

        <label>email</label>
        <input type="email" name="email" value="{{ email|default:'' }}" required autocomplete="email">

        <label>Password</label>
        <input type="password" name="password" required minlength="6" autocomplete="new-password">

        <label>Confirm Password</label>
        <input type="password" name="confirm_password" value="" required minlength="6" autocomplete="new-password">

        <button type="submit" class="btn-primary">Sign up</button>
    </form>

    <p class="muted">
        Already have an account?
        <a href="{% url 'accounts:login' %}">log in</a>
    </p>

</div>

{% endblock content %}
