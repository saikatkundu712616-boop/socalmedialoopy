{% extends 'base.html' %}
{% block title %}Log in · Looply{% endblock %}

{% block content %}
<div class="auth-card">
    <h2>Welcome back</h2>
    <p class="muted">Log in to continue to Looply.</p>

    <form method="POST" novalidate>
        {% csrf_token %}
        <input type="hidden" name="next" value="{{ request.GET.next }}">

        <label>Username</label>
        <input type="text" name="username" value="{{ username|default:'' }}"
               required autofocus autocomplete="username">

        <label>Password</label>
        <input type="password" name="password" required autocomplete="current-password">

        <button type="submit" class="btn-primary btn-block" style="margin-top: 24px;">
            Log in
        </button>
    </form>

    <p class="form-footer">
        New here?
        <a href="{% url 'accounts:register' %}">Create an account</a>
    </p>
</div>
{% endblock %}
